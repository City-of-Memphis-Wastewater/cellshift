name: Build Debian Package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(uv run python -c "from cellshift._version import get_version; print(get_version())")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Stage application files into filesystem layout
      # ------------------------------------------------------------
      - name: Stage application venv & assets
        run: |
          APP_NAME="cellshift"
          
          # App virtual environment
          python3 -m venv "deb/pkg/opt/$APP_NAME/venv"
          "deb/pkg/opt/$APP_NAME/venv/bin/pip" install --upgrade pip
          "deb/pkg/opt/$APP_NAME/venv/bin/pip" install .

          # Launcher & Desktop Entry
          install -Dm755 deb/launcher.sh "deb/pkg/usr/bin/$APP_NAME"
          install -Dm644 deb/cellshift.desktop deb/pkg/usr/share/applications/cellshift.desktop

          # Icons
          mkdir -p deb/pkg/usr/share/icons/hicolor/scalable/apps
          cp src/cellshift/data/icons/max-green.svg "deb/pkg/usr/share/icons/hicolor/scalable/apps/$APP_NAME.svg"

      # ------------------------------------------------------------
      # Render control file & build .deb package via maxson-build-utils
      # ------------------------------------------------------------
      - name: Build .deb Package
        run: uv run maxson-build-utils build-deb --arch ${{ matrix.arch }}

      # ------------------------------------------------------------
      # Smoke test installed package
      # ------------------------------------------------------------
      - name: Smoke test .deb package
        run: |
          set -euo pipefail
          sudo apt-get install -y ./deb/*.deb

          which cellshift
          cellshift --version
          /opt/cellshift/venv/bin/python -c "import cellshift; print('import ok')"

      # ------------------------------------------------------------
      # Upload & Publish
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cellshift-${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          path: deb/*.deb

      - name: Publish release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}