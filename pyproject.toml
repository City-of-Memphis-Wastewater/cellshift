[project]
name = "cellshift"
description = "XLSX based contract files change year to year at the City of Memphis Department of Public Works. For example, an existing 2025 contract spreadsheet can be easily cast to a 2026 contract spreadsheet using cellshift."
readme = "README.md"
dependencies = [
    "dworshak-config>=0.2.8",
    "openpyxl>=3.1.5",
    "pyhabitat>=1.3.9",
    "typer>=0.27.0",
    "typer-helptree>=0.2.12",
]

dynamic = ["version"]
#license = "null" # not yet
requires-python = ">=3.10,<3.15"
authors = [
    { name = "George Clayton Bennett", email = "george.bennett@memphistn.gov" },
    { name = "Ranisha Lomax", email = "ranisha.lomax@memphistn.gov" }
]
maintainers = [
    { name = "George Clayton Bennett", email = "george.bennett@memphistn.gov" },
    { name = "Ranisha Lomax", email = "ranisha.lomax@memphistn.gov" }
]

# ---

classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers", # library and documentation
    "Intended Audience :: Science/Research", # Technical manuals, engineering
    "Intended Audience :: Other Audience", # Government/engineering docs
    "Topic :: File Formats",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
    #"Development Status :: 4 - Beta",
    #"Development Status :: 5 - Production/Stable",
]

keywords = [
    "annual-contracts",
    "document-processing",
]

[project.urls]
Homepage = "https://github.com/city-of-memphis-wastewater/cellshift"
Repository = "https://github.com/city-of-memphis-wastewater/cellshift"
Issues = "https://github.com/city-of-memphis-wastewater/cellshift/issues"
Changelog = "https://raw.githubusercontent.com/city-of-memphis-wastewater/cellshift/main/docs/CHANGELOG.md"

[project.scripts]
cellshift = "cellshift.__main__:app"


#[project.optional-dependencies]

# add with `uv sync --group dev`, plus other extras, like `--extra pdfium`
[dependency-groups]
dev = [
    "build>=1.3.0",
    "pyinstaller>=6.17.0 ; platform_system == 'Linux' and platform_machine != 'aarch64'", # to avoid on termux
    "shiv>=1.0.8",
    "ruff>=0.7.0 ; platform_system == 'Linux' and platform_machine != 'aarch64'", # to avoid on termux
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "maxson-build-utils>=0.1.5",
]


[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
cellshift = { path = "src/cellshift" }
#pyhabitat = { path = "../pyhabitat/dist/pyhabitat-1.2.3-py3-none-any.whl" }
maxson-build-utils = { path = "../maxson-build-utils/", editable = true }


[tool.setuptools.dynamic]
version = {file = "src/cellshift/VERSION"}
