id: io.github.city_of_memphis_wastewater.cellshift
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: cellshift
modules:
  - name: cellshift
    buildsystem: simple
    build-commands:
      # 1. Install wheel
      - pip3 install --ignore-installed --no-index --find-links=vendor-wheels --prefix=/app dist/*.whl
      
      # 2. Desktop Integration Files
      - install -Dm644 io.github.city_of_memphis_wastewater.cellshift.desktop /app/share/applications/io.github.city_of_memphis_wastewater.cellshift.desktop
      - install -Dm644 io.github.city_of_memphis_wastewater.cellshift.metainfo.xml /app/share/metainfo/io.github.city_of_memphis_wastewater.cellshift.metainfo.xml
      - install -Dm644 src/cellshift/data/icons/placeholder.svg /app/share/icons/hicolor/scalable/apps/io.github.city_of_memphis_wastewater.cellshift.svg
      
      # 3. License
      - install -Dm644 LICENSE /app/share/licenses/cellshift/LICENSE
    sources:
      - type: dir
        path: .